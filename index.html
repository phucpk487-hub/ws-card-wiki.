<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7fa">
  <meta name="description" content="A searchable Weiss Schwarz card database and wiki: cards, sets and decks.">
  <title>Weiss Schwarz Card Wiki</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Apply theme before first paint to avoid a flash
    try { var t = localStorage.getItem('wsw-theme'); if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="bar">
      <a class="brand" href="#/" aria-label="Weiss Schwarz Card Wiki home"><span class="logo" aria-hidden="true">W<span>S</span></span><span class="brand-text">Card Wiki</span></a>
      <button id="menu-btn" class="icon-btn menu-btn" aria-label="Menu" aria-expanded="false" aria-controls="nav-links">☰</button>
      <nav id="nav-links" class="nav" aria-label="Main">
        <a data-nav="home" href="#/">Home</a>
        <a data-nav="cards" href="#/cards">Cards</a>
        <a data-nav="sets" href="#/sets">Sets</a>
        <a data-nav="decks" href="#/decks">Decks</a>
        <a data-nav="import" href="#/import">Import</a>
      </nav>
      <form id="header-search" class="header-search" role="search" autocomplete="off">
        <label class="sr-only" for="hq">Quick search</label>
        <input id="hq" name="q" type="search" placeholder="Search cards…">
      </form>
      <button id="theme-btn" class="icon-btn" aria-label="Toggle theme">☾</button>
    </div>
  </header>
  <main id="main" tabindex="-1"></main>
  <footer class="site-footer">
    <div class="container">
      <p>Unofficial fan project. Not affiliated with or endorsed by Bushiroad. Weiss Schwarz is a trademark of its owner.</p>
      <p class="muted">Card text and images belong to their respective owners and are shown for reference.</p>
    </div>
  </footer>
  <noscript><p style="padding:1rem">This site needs JavaScript to run.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
