# Builds an installable Android app (APK) and publishes it as a GitHub Release you can download on your phone.
# Runs on every push to main, or by hand: Actions tab > "Build Android app" > Run workflow.
name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run the tests
        run: npm test

      - name: Package the web app
        run: node tools/build-app.mjs

      - name: Install Capacitor and create the Android project
        run: |
          npm i -D @capacitor/cli
          npm i @capacitor/core @capacitor/android @capacitor/filesystem @capacitor/share
          npx cap add android
          npx cap sync android

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ws-card-wiki.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ws-card-wiki.apk \
            --title "Android app" \
            --notes "Debug build of commit ${GITHUB_SHA::7}. Download the .apk on your phone and open it to install."
