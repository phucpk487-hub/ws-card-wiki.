# Builds an installable Android app (APK) and publishes it as a GitHub Release you can download on your phone.
# Runs on every push to main, or by hand: Actions tab > "Build Android app" > Run workflow.
name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run the tests
        run: npm test

      - name: Stamp the version
        run: |
          printf "export const VERSION = '1.${{ github.run_number }}';\nexport const BUILD = ${{ github.run_number }};\nexport const COMMIT = '%s';\n" "${GITHUB_SHA::7}" > js/version.js
          cat js/version.js

      - name: Package the web app
        run: node tools/build-app.mjs

      - name: Install Capacitor and create the Android project
        run: |
          npm i -D @capacitor/cli
          npm i @capacitor/core @capacitor/android @capacitor/app @capacitor/filesystem @capacitor/share
          npx cap add android
          npx cap sync android

      - name: Put the app icon into the Android project
        run: |
          cp -r android-icons/res/. android/app/src/main/res/
          rm -f android/app/src/main/res/mipmap-*/ic_launcher_foreground.webp android/app/src/main/res/mipmap-*/ic_launcher*.webp 2>/dev/null || true
          ls android/app/src/main/res/mipmap-xxxhdpi android/app/src/main/res/mipmap-anydpi-v26 2>/dev/null

      # Android only installs a new version over an old one when both are signed with the same key.
      # A fresh build machine makes a fresh random key every time, so sign with a fixed one and number each build.
      # The key lives only in the repository secrets ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD, never in the code.
      - name: Sign every build with the same key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then echo "Add the repository secrets ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD (see APP.md)."; exit 1; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ws.jks"; PASS="$KS_PASS"
          python3 - <<PY
          import os, re
          p = 'android/app/build.gradle'; s = open(p).read()
          sign = "signingConfigs { debug { storeFile file('%s'); storePassword '%s'; keyAlias 'wswiki'; keyPassword '%s' } }\n    " % (os.environ['RUNNER_TEMP'] + '/ws.jks', os.environ.get('PASS', '$PASS'), os.environ.get('PASS', '$PASS'))
          s = s.replace('defaultConfig {', sign + 'defaultConfig {', 1)
          s = re.sub(r'versionCode \d+', 'versionCode ${{ github.run_number }}', s, 1)
          s = re.sub(r'versionName "[^"]*"', 'versionName "1.${{ github.run_number }}"', s, 1)
          open(p, 'w').write(s)
          PY
          grep -n "versionCode\|signingConfigs" android/app/build.gradle

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ws-card-wiki.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ws-card-wiki.apk \
            --title "Android app" \
            --notes "Build ${{ github.run_number }} · Debug build of commit ${GITHUB_SHA::7}. Download the .apk on your phone and open it to install."
