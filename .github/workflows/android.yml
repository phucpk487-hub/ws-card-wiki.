# Builds an installable Android test app (APK) and publishes it as a GitHub Release you can download on your phone.
# Runs on every push to main, or by hand: Actions tab > "Build Android app" > Run workflow.
name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      edition:
        description: 'Which edition to build'
        type: choice
        options: [admin, user]
        default: admin

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      EDITION: ${{ github.event.inputs.edition || 'admin' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run the tests
        run: npm test

      - name: Package the web app (${{ env.EDITION }} edition)
        run: node tools/build-app.mjs --edition "$EDITION"

      - name: Install Capacitor and create the Android project
        run: |
          npm i -D @capacitor/cli
          npm i @capacitor/core @capacitor/android @capacitor/filesystem @capacitor/share
          npx cap add android
          npx cap sync android

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "ws-card-wiki-${EDITION}.apk"
          gh release delete "latest-${EDITION}" --yes --cleanup-tag || true
          gh release create "latest-${EDITION}" "ws-card-wiki-${EDITION}.apk" \
            --title "Android app (${EDITION} edition)" \
            --notes "Debug build of commit ${GITHUB_SHA::7}. Download the .apk on your phone and open it to install."
