# Builds a SIGNED RELEASE bundle (.aab) for upload to Google Play Console.
# Run by hand: Actions tab > "Build Play Store bundle" > Run workflow.
# Uses the same repository secrets as the APK build (ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, key alias "wswiki").
# The .aab is attached to the workflow run as an artifact (Actions > the run > Artifacts), NOT published to Releases.
name: Build Play Store bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run the tests
        run: npm test

      - name: Stamp the version
        run: |
          printf "export const VERSION = '1.${{ github.run_number }}';\nexport const BUILD = ${{ github.run_number }};\nexport const COMMIT = '%s';\nexport const STORE = true;\n" "${GITHUB_SHA::7}" > js/version.js

      - name: Package the web app
        run: node tools/build-app.mjs

      - name: Install Capacitor and create the Android project
        run: |
          npm i -D @capacitor/cli
          npm i @capacitor/core @capacitor/android @capacitor/app @capacitor/filesystem @capacitor/share
          npx cap add android
          npx cap sync android

      - name: Put the app icon into the Android project
        run: |
          cp -r android-icons/res/. android/app/src/main/res/
          # the template's own adaptive icon points at its default drawables; ours uses the mipmap foreground and the colour
          rm -f android/app/src/main/res/drawable/ic_launcher_background.xml android/app/src/main/res/drawable-v24/ic_launcher_foreground.xml
          rm -f android/app/src/main/res/mipmap-*/ic_launcher_foreground.webp android/app/src/main/res/mipmap-*/ic_launcher*.webp 2>/dev/null || true
          ls android/app/src/main/res/mipmap-xxxhdpi android/app/src/main/res/mipmap-anydpi-v26 2>/dev/null

      - name: Sign the release with the upload key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then echo "Add the repository secrets ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD (see APP.md)."; exit 1; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ws.jks"
          PASS="$KS_PASS" KS_FILE="$RUNNER_TEMP/ws.jks" python3 - <<'PY'
          import os, re
          p = 'android/app/build.gradle'; s = open(p).read()
          sign = "signingConfigs { release { storeFile file('%s'); storePassword '%s'; keyAlias 'wswiki'; keyPassword '%s' } }\n    " % (os.environ['KS_FILE'], os.environ['PASS'], os.environ['PASS'])
          s = s.replace('defaultConfig {', sign + 'defaultConfig {', 1)
          # attach the signing config to the release build type
          s = re.sub(r'(buildTypes\s*\{\s*release\s*\{)', r'\1\n            signingConfig signingConfigs.release', s, 1)
          s = re.sub(r'versionCode \d+', 'versionCode ${{ github.run_number }}', s, 1)
          s = re.sub(r'versionName "[^"]*"', 'versionName "1.${{ github.run_number }}"', s, 1)
          open(p, 'w').write(s)
          PY
          grep -n "signingConfig\|versionCode\|targetSdk" android/app/build.gradle android/variables.gradle

      - name: Build the release bundle
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Check the bundle is signed
        run: |
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: ws-card-wiki-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
